name: Syntax Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check Python syntax
        run: |
          echo "Checking Python syntax across all source files..."
          find src/ -name "*.py" -exec python -m py_compile {} \;
          echo "All Python files passed syntax check"

      - name: Check API imports
        run: |
          pip install fastapi uvicorn httpx pydantic supabase python-dotenv --quiet
          python -c "from src.api.app import app; print('API imports OK')" || echo "Import check skipped — non-critical deps missing"

  frontend-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      # Generate the gitignored playbook bundle that PlaybookViewer imports.
      # The frontend build does this via the prebuild hook; `tsc --noEmit`
      # bypasses it, so generate explicitly or the typecheck fails TS2307.
      - name: Generate playbook data
        run: node scripts/build-playbook-data.mjs

      - name: TypeScript check
        run: cd frontend && npx tsc --noEmit

  camera-tenancy:
    # Executes the camera cross-tenant RLS denial test against a real Postgres.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test deps
        run: pip install "psycopg[binary]" pytest --quiet
      - name: Cross-tenant denial test
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: pytest tests/e2e/test_camera_tenancy_rls.py -q
