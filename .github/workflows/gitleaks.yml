name: gitleaks

# Server-side secret-scan backstop. The .pre-commit-config.yaml hook catches
# secrets at commit-time but only for contributors who ran
# `pre-commit install --install-hooks` after cloning. This job runs on every
# PR push and full main push so a clone that skipped that step still can't
# land a credential without the scan failing in CI.

on:
  pull_request:
  push:
    branches:
      - main

# gitleaks-action lists the PR's commits via the API; without pull-requests:read
# the default token 403s ("Resource not accessible by integration") and the
# check fails on every PR regardless of content.
permissions:
  contents: read
  pull-requests: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # gitleaks needs history for commits scan

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        with:
          config-path: .gitleaks.toml
        env:
          # Standard gitleaks-action knobs. GITHUB_TOKEN is auto-populated.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
