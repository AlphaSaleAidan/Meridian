name: SOC 2 Control Tests

# Offline control tests run on every PR (fast, no secrets). The weekly
# scheduled run additionally executes the read-only live collectors when
# management credentials are configured, and uploads the evidence bundle —
# that periodic artifact trail is what a Type II observation window samples.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 9 * * 1"   # Mondays 09:00 UTC

jobs:
  control-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        # Install the real backend requirements so `from src.api.app import app`
        # resolves exactly as in prod (the route-auth matrix inspects the live
        # app object). Plus the test-only deps.
        #
        # FastAPI is then pinned to 0.124.x: requirements.txt only floors it
        # (`fastapi>=0.115.6`), and a clean install now resolves to 0.139, under
        # which app.py's include_router registers 0 of 292 routes (breaking
        # change) — the route matrix would inspect an empty app. 0.124.x is the
        # version prod runs and the version public_endpoint_baseline.yaml is
        # anchored to, so the ratchet must evaluate against it.
        # NOTE (separate finding): requirements.txt needs a FastAPI upper bound;
        # a fresh prod deploy would otherwise ship the broken 0.139 app.
        run: |
          pip install --quiet -r requirements.txt
          pip install --quiet "fastapi>=0.124,<0.125"
          pip install --quiet pytest pytest-asyncio pyyaml

      - name: Run SOC 2 control tests
        env:
          COMPLIANCE_EVIDENCE_DIR: compliance-evidence
        run: python -m pytest tests/compliance -q

      - name: Fee parity guard (backend redlines == frontend plan files)
        # This suite silently rotted once (#461 changed prices everywhere but
        # here, and no CI gate ran it). Keep it in the gate so price drift —
        # or a dead detector — turns the build red.
        run: python -m pytest tests/test_fee_parity_terms.py -q

      - name: Live evidence collectors (read-only, scheduled runs only)
        if: github.event_name == 'schedule'
        env:
          COMPLIANCE_EVIDENCE_DIR: compliance-evidence
          SUPABASE_MGMT_TOKEN: ${{ secrets.SUPABASE_MGMT_TOKEN }}
          SUPABASE_PROJECT_REF_MERIDIAN: ${{ secrets.SUPABASE_PROJECT_REF_MERIDIAN }}
        run: |
          python scripts/compliance/collect_rls_evidence.py
          python scripts/compliance/collect_backup_evidence.py

      - name: Readiness report
        if: always()
        env:
          COMPLIANCE_EVIDENCE_DIR: compliance-evidence
        run: python scripts/compliance/readiness_report.py

      - name: Upload evidence bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compliance-evidence-${{ github.run_id }}
          path: compliance-evidence/
          retention-days: 400
