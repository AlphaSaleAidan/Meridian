name: Deploy Frontend

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Rebuild frontend on production server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          password: ${{ secrets.DEPLOY_PASSWORD }}
          command_timeout: 30m
          script: |
            set -euo pipefail
            # Build in the dedicated deploy tree, pinned to EXACT origin/main.
            # /root/Meridian is a working checkout that may sit on any feature
            # branch — never `git pull` there; only its gitignored dist/ (the
            # nginx docroot for meridian.tips) is swapped, atomically via rsync.
            cd /root/meridian-us-ready
            git fetch origin main
            git checkout --detach origin/main
            cd frontend
            # .env.local (gitignored) must exist or the build silently ships
            # demo-mode with broken Supabase auth.
            test -s .env.local
            npm install --no-audit --no-fund
            npm run build
            grep -rlq "supabase.co" dist/assets/*.js
            # Re-bake per-route crawlable HTML. A plain `npm run build` ships the
            # blank SPA shell for all ~245 routes, and rsync --delete below then
            # wipes the prerendered pages from the docroot — this exact workflow
            # caused the 2026-07-12 SEO regression (restored manually 07-13).
            # PRERENDER_PORT: the 4188 default is often taken on this box; vite
            # preview silently binds the next free port while prerender still
            # queries the configured one, so pin an uncommon port.
            PRERENDER_PORT=45177 bash scripts/prerender-all.sh
            test -s dist/about/index.html
            # Bump the service-worker cache name to the commit being shipped.
            # WHY THIS IS NOT OPTIONAL: sw.js caches the bundle under
            # CACHE_NAME, so shipping new assets under an UNCHANGED name leaves
            # every returning client serving the old JS — the feature looks
            # missing on live while the docroot is provably correct. That has
            # bitten this project repeatedly (2026-08-08 and again 2026-08-14,
            # when the portal shipped under a name from the day before).
            # Deriving it from the SHA means it can never be forgotten.
            SW_NAME="meridian-$(git rev-parse --short HEAD)-$(date -u +%Y%m%d)"
            sed -i "s/const CACHE_NAME = '[^']*'/const CACHE_NAME = '${SW_NAME}'/" dist/sw.js
            grep -q "const CACHE_NAME = '${SW_NAME}'" dist/sw.js
            rsync -a --delete dist/ /root/Meridian/frontend/dist/
            echo "deployed $(git rev-parse --short HEAD) to /root/Meridian/frontend/dist"
