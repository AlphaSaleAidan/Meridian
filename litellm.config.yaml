# Meridian LiteLLM gateway — single-host on 127.0.0.1:4000.
#
# Four model aliases the rest of the stack speaks:
#   meridian-architect → Kimi K2.6 (planning + critique, swarm lead)
#   meridian-fixer     → Kimi K2.6 (autonomous server fixer)
#   meridian-fast      → free/cheap tier (high-volume worker subtasks)
#   meridian-local     → llama-cpp qwen-server on :8002 (truly free fallback)
#
# Fallback chain: K2.6 → fast → local. Swap K2.6 to self-hosted vLLM later by
# changing only the meridian-architect/meridian-fixer entries to a local
# openai/* model + api_base. Nothing downstream changes.

model_list:
  # --- Primary reasoning + swarm lead ---
  - model_name: "meridian-architect"
    litellm_params:
      model: "openrouter/moonshotai/kimi-k2.6"
      max_tokens: 16384
      api_key: "os.environ/OPENROUTER_API_KEY"
      timeout: 600
      stream_timeout: 600

  # --- Autonomous fixer (agentic coding) ---
  - model_name: "meridian-fixer"
    litellm_params:
      model: "openrouter/moonshotai/kimi-k2.6"
      max_tokens: 16384
      api_key: "os.environ/OPENROUTER_API_KEY"
      timeout: 600
      stream_timeout: 600

  # --- Fast / cheap tier (any provider with a key serves; LiteLLM round-robins) ---
  - model_name: "meridian-fast"
    litellm_params:
      model: "groq/llama-3.3-70b-versatile"
      api_key: "os.environ/GROQ_API_KEY"
  - model_name: "meridian-fast"
    litellm_params:
      model: "cerebras/llama-3.3-70b"
      api_key: "os.environ/CEREBRAS_API_KEY"
  - model_name: "meridian-fast"
    litellm_params:
      model: "openai/Meta-Llama-3.1-405B-Instruct"
      api_base: "https://api.sambanova.ai/v1"
      api_key: "os.environ/SAMBANOVA_API_KEY"
  - model_name: "meridian-fast"
    litellm_params:
      model: "deepseek/deepseek-chat"
      api_key: "os.environ/DEEPSEEK_API_KEY"

  # --- Local fallback: existing llama-cpp qwen-server on :8002 (OpenAI-compatible) ---
  - model_name: "meridian-local"
    litellm_params:
      model: "openai/Qwen2.5-7B-Instruct"
      api_base: "http://localhost:8002/v1"
      api_key: "sk-local-noauth"
      timeout: 120

router_settings:
  routing_strategy: "simple-shuffle"
  num_retries: 2
  timeout: 600
  fallbacks:
    - "meridian-architect": ["meridian-fast", "meridian-local"]
    - "meridian-fixer": ["meridian-fast", "meridian-local"]
    - "meridian-fast": ["meridian-local"]
  redis_host: "localhost"
  redis_port: 6379

litellm_settings:
  set_verbose: false
  drop_params: true
  cache: true
  cache_params:
    type: "redis"
    host: "localhost"
    port: 6379
    ttl: 600
  # Budget cap on total gateway spend (USD per budget_duration window).
  # The placeholder is substituted at launch time from .env.litellm:LITELLM_MAX_BUDGET
  # (see scripts/start-litellm.sh). Doing the swap in shell rather than via
  # `os.environ/X` because LiteLLM doesn't cast env-var resolved values back
  # to float — the comparison `current_spend > max_budget` then fails with a
  # TypeError surfaced as a misleading 401. Edit only LITELLM_MAX_BUDGET in
  # .env.litellm when funding more credit; committed config stays stable.
  max_budget: __LITELLM_MAX_BUDGET__
  budget_duration: "30d"

general_settings:
  store_model_in_db: false
  disable_spend_logs: false
  # Slack alerting deferred — needs SLACK_WEBHOOK_URL. Add the alerting block
  # back when the webhook is provisioned. Until then, spend tracking happens
  # via the proxy's built-in spend log (queryable at /global/spend with the
  # master key) so we don't lose visibility.
