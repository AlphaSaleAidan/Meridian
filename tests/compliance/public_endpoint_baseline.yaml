# CC6.6 public-endpoint baseline (RATCHET) — generated 2026-07-12 from origin/main c5bf0e1f.
#
# Every route listed here is served WITHOUT a FastAPI auth dependency
# (require_admin / require_jwt / require_admin_jwt / require_service_auth /
# require_org_access / require_org_member). The control test fails when a
# route not in this file goes public — new endpoints must either take an
# auth dependency or be added here deliberately, in review, with a category.
# It also fails when an entry here is no longer public, so the list never
# goes stale. Do NOT bulk-regenerate this file to make CI pass.
#
# Categories: health | webhook | oauth | payment-page | public-form |
#             inline-auth (auth enforced inside the handler — cite it) |
#             unreviewed (open CC6.6 gap, burn this list down)

health:
  # Liveness probe — no data exposure.
  - "GET /api/webhooks/square/health"
  - "GET /health"
  - "GET /sms/health"
  - "GET /twilio/health"

payment-page:
  # Customer-facing hosted payment redirect/result pages (opaque short code).
  - "GET /p/{code}"
  - "GET /pay/cancel"
  - "GET /pay/success"

oauth:
  # OAuth dance / provider discovery — browser-redirect flow, no session yet.
  - "GET /api/clover/authorize"
  - "GET /api/clover/callback"
