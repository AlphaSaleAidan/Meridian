# Meridian Agent Registry (masterplan Phase 4)
#
# Machine-readable source of truth for the agent fleet. Two jobs:
#   1. Feed model-tier assignments into the tiered router
#      (src/ai/routing/registry_loader.load_registry_tiers → load_agent_tiers).
#      Only `calls_llm: true` rows carry a routing `model_tier`.
#   2. Gate drift: scripts/validate_agents.py asserts every concrete
#      BaseAgent subclass in the code has a row here, and that every row
#      with a class+module resolves and is internally consistent.
#
# Field reference
#   name        recorded agent_name (BaseAgent.name, class name, or the
#               llm_layer call-path function name). MUST be unique.
#   class       Python class name (optional for functional call paths).
#   module      import path of `class` (optional with class omitted).
#   category    analytics_ml | cross_reference | generation | orchestration
#               | voice_realtime | integration
#   exec_tier   BaseAgent execution tier (1..6); ordering only, NOT the model
#               tier. null for non-BaseAgent agents.
#   calls_llm   true if the agent routes through llm_layer.
#   model_tier  lightweight | standard | heavy_reasoning. MUST be set iff
#               calls_llm is true; MUST be null otherwise.
version: 1

agents:
