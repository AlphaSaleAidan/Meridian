spring:
  r2dbc:
    url: ${R2DBC_URL:r2dbc:postgresql://host.docker.internal:54322/postgres}
    username: ${R2DBC_USER:postgres}
    password: ${R2DBC_PASSWORD:postgres}
    pool:
      enabled: true
      initial-size: 5
      max-size: 10

supabase:
  url: http://127.0.0.1:54321
  key: ${SUPABASE_KEY}

security:
  csrf:
    enabled: false
