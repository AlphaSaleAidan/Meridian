spring:
  r2dbc:
    url: ${R2DBC_URL:r2dbc:postgresql://127.0.0.1:54322/postgres}
    username: ${R2DBC_USER:postgres}
    password: ${R2DBC_PASSWORD:postgres}
    pool:
      enabled: true
      initial-size: 5
      max-size: 10

  # JDBC DataSource used only by spring-session-jdbc (HTTP session persistence).
  datasource:
    url: ${JDBC_URL:jdbc:postgresql://127.0.0.1:54322/postgres}
    username: ${JDBC_USER:postgres}
    password: ${JDBC_PASSWORD:postgres}

supabase:
  url: http://127.0.0.1:54321
  key: ${SUPABASE_KEY}

meridian:
  auth:
    # Local SPA dev server (vite). Must also be in backend/supabase/config.toml
    # additional_redirect_urls or local Supabase silently falls back to site_url.
    # TODO: update if the SPA dev port/route changes (and keep config.toml's
    # additional_redirect_urls in sync — both must change together).
    password-reset-redirect-url: ${PASSWORD_RESET_REDIRECT_URL:http://localhost:5173/customer/login}

security:
  csrf:
    enabled: false
