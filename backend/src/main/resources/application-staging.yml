spring:
  r2dbc:
    url: ${SUPABASE_R2DBC_URL}
    username: ${SUPABASE_DB_USER}
    password: ${SUPABASE_DB_PASSWORD}
    pool:
      enabled: true
      initial-size: 5
      max-size: 20

  # JDBC DataSource used only by spring-session-jdbc (HTTP session persistence).
  datasource:
    url: ${SUPABASE_DB_URL}
    username: ${SUPABASE_DB_USER}
    password: ${SUPABASE_DB_PASSWORD}

supabase:
  url: ${SUPABASE_URL}
  key: ${SUPABASE_KEY}

meridian:
  auth:
    # HELD empty on purpose (staging host/allow-list not settled) — set the env
    # var to temp a value; empty falls back to the Supabase project's site_url.
    # TODO: once the staging host exists, set a real default here AND add it to
    # the staging Supabase project's redirect allow-list.
    password-reset-redirect-url: ${PASSWORD_RESET_REDIRECT_URL:}
