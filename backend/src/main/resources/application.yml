# Note: DatabaseClient / R2DBC connection parameters are configured per environment profile
# (application-local.yml, application-staging.yml, application-prod.yml). If stricter connection
# or connection pool controls are required in the future, DatabaseClient can be programmatically
# configured via a @Configuration bean in code.
spring:
  application:
    name: meridian-backend

security:
  csrf:
    enabled: true

  threads:
    virtual:
      enabled: true

  session:
    store-type: jdbc
    jdbc:
      initialize-schema: always

  jackson:
    default-property-inclusion: non_null

server:
  port: ${PORT:8080}

meridian:
  portal:
    base-url: ${MERIDIAN_PORTAL_BASE_URL:https://canada.meridian.tips}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.meridian: DEBUG
