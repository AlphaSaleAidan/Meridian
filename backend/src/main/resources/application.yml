# Note: R2DBC (DatabaseClient) is the application's data-access path. A JDBC DataSource is
# also configured per environment profile because spring-session-jdbc persists HTTP sessions
# over JDBC — without it Boot silently falls back to in-container (Tomcat memory) sessions.
# Connection parameters for both live in application-local.yml / application-staging.yml /
# application-prod.yml.
spring:
  application:
    name: meridian-backend

  threads:
    virtual:
      enabled: true

  session:
    jdbc:
      # "embedded" = Boot does NOT create the SPRING_SESSION tables on Postgres.
      # Local: scripts/sql/init-local-db.sql creates them. Staging/prod: apply the same
      # DDL as a Supabase migration before cutover.
      initialize-schema: embedded

  jackson:
    default-property-inclusion: non_null

security:
  csrf:
    enabled: true

server:
  port: ${PORT:8080}

meridian:
  portal:
    base-url: ${MERIDIAN_PORTAL_BASE_URL:https://canada.meridian.tips}
  auth:
    # Where the Supabase password-reset email link lands. Supabase otherwise uses its
    # configured site_url (historically a stale Vercel URL -> broken reset links).
    # Must be in Supabase's redirect allow-list. Empty = fall back to site_url.
    password-reset-redirect-url: ${PASSWORD_RESET_REDIRECT_URL:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.meridian: DEBUG
