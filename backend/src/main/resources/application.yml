spring:
  application:
    name: meridian-backend

  threads:
    virtual:
      enabled: true

  session:
    store-type: jdbc
    jdbc:
      initialize-schema: embedded

  jpa:
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  jackson:
    default-property-inclusion: non_null

security:
  csrf:
    enabled: true

server:
  port: ${PORT:8080}

meridian:
  portal:
    base-url: ${MERIDIAN_PORTAL_BASE_URL:https://canada.meridian.tips}
  auth:
    admin-emails: ${MERIDIAN_ADMIN_EMAILS:apierce@alphasale.co,aidanpierce72@gmail.com,aidanpierce@meridian.tips,cheungenochmgmt@gmail.com,aidanvietnguyen@gmail.com}
    tenancy-enforcement-disabled: ${TENANCY_ENFORCEMENT_DISABLED:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.meridian: DEBUG
