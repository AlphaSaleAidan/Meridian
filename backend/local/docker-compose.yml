services:
  backend:
    build:
      context: ../
      dockerfile: Dockerfile
    container_name: meridian-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=local
      - SUPABASE_KEY=${PUBLISHABLE_KEY}
      # Override the local profile URLs to use host.docker.internal 
      # so the container can reach the Supabase services running on the Mac host
      - SPRING_R2DBC_URL=r2dbc:postgresql://host.docker.internal:54322/postgres
      - SUPABASE_URL=http://host.docker.internal:54321
    extra_hosts:
      # This ensures host.docker.internal resolves correctly on Linux/Mac
      - "host.docker.internal:host-gateway"
