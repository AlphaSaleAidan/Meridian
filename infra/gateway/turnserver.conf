# coturn TURN/STUN for Meridian camera streaming (Phase 2).
# Relays WebRTC media for viewers on cellular / strict NAT. Self-hosted = predictable
# cost but uses Contabo egress — monitor bandwidth. NOT started by this PR (gated).
#
# Rotating shared secret: do NOT put the secret here. Inject it at deploy time, e.g.
#   echo "static-auth-secret=$MERIDIAN_TURN_SECRET" >> /etc/turnserver.conf
# or template this file. Rotate the secret periodically (REST API ephemeral creds).

listening-port=3478
# tls-listening-port=5349        # enable with certs in production
fingerprint
use-auth-secret
# static-auth-secret=<INJECTED AT DEPLOY — never commit>
realm=meridian.tips
# Restrict relay range so it can't be abused as an open relay:
min-port=49160
max-port=49260
no-cli
no-tcp-relay
# Drop loopback/multicast peers (anti-abuse):
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=::1
# external-ip=<CONTABO_PUBLIC_IP>   # set at deploy
log-file=stdout
